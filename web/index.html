  <style>
    html, body { margin: 0; background: #101C2B; }
    html { min-height: 100%; }
    body { min-height: 100vh; min-height: var(--game-visible-height, 100dvh); }
    #app-host { position: relative; width: 100%; height: 100vh; height: var(--game-visible-height, 100dvh); background: #101C2B; }
    #map-download-status {
      box-sizing: border-box; width: 100%; padding: 10px 16px;
      padding-top: calc(10px + env(safe-area-inset-top, 0px));
      background: #1b3040; color: #fff9ef; font: 14px/1.4 system-ui, sans-serif;
    }
    #map-download-status p { margin: 0; font-weight: 600; }
    #map-download-status progress { display: block; width: 100%; height: 6px; margin: 7px 0; border: 0; border-radius: 3px; overflow: hidden; accent-color: #e6be77; background: #344c5c; }
    #map-download-status progress::-webkit-progress-bar { background: #344c5c; }
    #map-download-status progress::-webkit-progress-value { background: #e6be77; }
    #map-download-status progress::-moz-progress-bar { background: #e6be77; }
    #map-download-status small { display: block; font-size: 12px; color: #d7e1e5; }
    @media (orientation: landscape) {
      body { min-height: 100vh; min-height: 100lvh; }
      #app-host { height: 100vh; height: 100lvh; }
    }
    /* Native document scrolling lets mobile Safari collapse its toolbar.
       Keep the map and the action buttons on Flutter's gesture surface. */
    .browser-scroll-rail { display: none; }
    @media (orientation: landscape) and (pointer: coarse) {
      body { min-height: calc(100vh + 180px); min-height: calc(100lvh + 180px); }
      #app-host { position: sticky; top: 0; }
      .browser-scroll-rail {
        display: block; position: fixed; top: 100px; bottom: 160px;
        width: 18vw; z-index: 1000; touch-action: pan-y;
        -webkit-user-select: none; user-select: none;
      }
      #browser-scroll-left { left: 0; }
      #browser-scroll-right { right: 0; }
    }
    body:has(.attack-tap-native[style*="visibility:hidden"],
             .attack-tap-native[style*="visibility: hidden"],
             input:focus, textarea:focus, [role="dialog"], [role="menu"]) .browser-scroll-rail {
      display: none;
    }
    /* Override the native button shape, which Flutter refreshes inline. */
    .attack-tap-native, .attack-tap-half {
      border-radius: 16px !important;
      touch-action: none !important;
    }
    .attack-tap-native[data-thumb-side="left"]:enabled,
    .attack-tap-half[data-side="left"]:enabled { background-image: var(--thumb-tap-left) !important; transform: scaleX(-1); }
    .attack-tap-native[data-thumb-side="right"]:enabled,
    .attack-tap-half[data-side="right"]:enabled { background-image: var(--thumb-tap-right) !important; }
    .attack-tap-half { display: none !important; }
    @media (orientation: portrait) {
      .attack-tap-native, .attack-tap-half { -webkit-tap-highlight-color: transparent; }
      .attack-tap-native[data-split-ready] { opacity: 0 !important; pointer-events: none !important; }
      .attack-tap-half { display: block !important; }
    }
    /* Repeated taps must not select Flutter's accessibility text on iOS. */
    body[data-map-loading] #app-host { display: none !important; }
    #app-host, #app-host * {
      -webkit-user-select: none !important;
      user-select: none !important;
      -webkit-touch-callout: none !important;
    }
    #app-host input, #app-host textarea, #app-host [contenteditable="true"] {
      -webkit-user-select: text !important;
      user-select: text !important;
      -webkit-touch-callout: default !important;
    }
    #safe-area-probe {
      position: fixed; visibility: hidden; pointer-events: none;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
  </style>

  <div id="safe-area-probe" aria-hidden="true"></div>
