name: Deploy regional ads API

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regional-ads-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server/regional-ads
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate settings
        env:
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: |
          node --input-type=module - <<'JS'
          for (const name of ['CLOUDFLARE_API_TOKEN', 'CLOUDFLARE_ACCOUNT_ID',
            'RAKUTEN_APPLICATION_ID', 'RAKUTEN_ACCESS_KEY', 'RAKUTEN_AFFILIATE_ID']) {
            if (!process.env[name]) throw new Error(`Missing GitHub Secret: ${name}`);
          }
          JS
      - run: npm ci
      - run: npm test
      - name: Deploy worker
        run: npm run deploy
      - name: Configure server-side secrets
        env:
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: |
          node --input-type=module - <<'JS' | npx wrangler secret bulk
          const names = ['RAKUTEN_APPLICATION_ID', 'RAKUTEN_ACCESS_KEY', 'RAKUTEN_AFFILIATE_ID'];
          process.stdout.write(JSON.stringify(Object.fromEntries(names.map(name => [name, process.env[name]]))));
          JS

      - name: Verify deployed nationwide advertisements
        env:
          REGIONAL_ADS_ENDPOINT: ${{ vars.REGIONAL_ADS_ENDPOINT }}
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('../../assets/data/affiliate_config.json'));
          const endpoint = process.env.REGIONAL_ADS_ENDPOINT || config.endpoint;
          let nonNaraAds = 0, nonNaraFurusato = 0;
          for (const city of ['29201', '24208', '01101', '13101', '47201']) {
            const url = new URL(endpoint);
            url.searchParams.set('city', city);
            const response = await fetch(url, {headers:{Origin:'https://18quad.github.io'},signal:AbortSignal.timeout(60000)});
            if (!response.ok) throw new Error(`Advertising API ${city}: HTTP ${response.status}`);
            const body = await response.json();
            if (body.cityId !== city || !Array.isArray(body.ads)) throw new Error(`Invalid advertising response for ${city}`);
            const counts = {};
            for (const ad of body.ads) {
              if (ad.cityId !== city || new URL(ad.url).hostname !== 'hb.afl.rakuten.co.jp') throw new Error('Wrong municipality or affiliate link');
              counts[ad.category] = (counts[ad.category] || 0) + 1;
            }
            if (!city.startsWith('29')) { nonNaraAds += body.ads.length; nonNaraFurusato += counts.furusato || 0; }
            console.log('Verified advertising categories:', city, JSON.stringify(counts));
          }
          if (!nonNaraAds || !nonNaraFurusato) throw new Error('Nationwide affiliate or furusato ads are missing; check upstream API configuration.');
          JS
