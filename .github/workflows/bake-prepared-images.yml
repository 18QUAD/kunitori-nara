name: Bake prepared map images
on:
  push:
    branches: [wip/nationwide-20261015]
    paths:
      - tools/bake_background_shard.py
      - data/prepared_map_inputs/land.tar.gz
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backgrounds:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'shapely>=2,<3' Pillow numpy
      - run: python tools/bake_background_shard.py --shard ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-background-${{ matrix.shard }}
          path: background-${{ matrix.shard }}.tar.gz
          compression-level: 0
          retention-days: 3
