name: Publish Flutter Web

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: publish-web
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Verify Nara advertising API
        env:
          REGIONAL_ADS_ENDPOINT: ${{ vars.REGIONAL_ADS_ENDPOINT }}
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('assets/data/affiliate_config.json', 'utf8'));
          const endpoint = process.env.REGIONAL_ADS_ENDPOINT || config.endpoint;
          if (!endpoint) { console.log('Ads disabled: no endpoint configured.'); process.exit(0); }
          const url = new URL(endpoint);
          url.searchParams.set('city', '29201');
          const response = await fetch(url, {signal: AbortSignal.timeout(60000)});
          if (!response.ok) throw new Error(`Advertising API HTTP ${response.status}`);
          const body = await response.json();
          if (body.cityId !== '29201' || !Array.isArray(body.ads)) throw new Error('Invalid advertising response');
          const counts = {};
          for (const ad of body.ads) counts[ad.category] = (counts[ad.category] || 0) + 1;
          console.log('Nara advertising categories:', JSON.stringify(counts));
          if (!body.ads.length) throw new Error('No Nara advertisements returned; check Rakuten API credentials and access.');
          url.searchParams.set('city', '29386');
          const mitsueResponse = await fetch(url, {signal: AbortSignal.timeout(60000)});
          if (!mitsueResponse.ok) throw new Error(`Mitsue advertising API HTTP ${mitsueResponse.status}`);
          const mitsue = await mitsueResponse.json();
          for (const ad of mitsue.ads.filter(ad => ad.category === 'hotel')) {
            const link = new URL(ad.url);
            const destination = link.searchParams.get('pc');
            if (!destination) throw new Error('Hotel affiliate link has no destination');
            const target = new URL(destination);
            console.log('Mitsue hotel link:', JSON.stringify({name: ad.name, host: target.hostname, path: target.pathname}));
            if (!target.hostname.endsWith('travel.rakuten.co.jp')) throw new Error('Unexpected hotel link host');
            const landing = await fetch(target, {signal: AbortSignal.timeout(20000)});
            const actual = new URL(landing.url);
            const hotelNo = actual.searchParams.get('f_no') || actual.searchParams.get('hotelNo') || actual.searchParams.get('f_hotel_no');
            console.log('Mitsue hotel landing:', JSON.stringify({name: ad.name, status: landing.status,
              host: actual.hostname, path: actual.pathname, hotelNo, contentType: landing.headers.get('content-type')}));
            await landing.body?.cancel();
            if (ad.name.replace(/[\s　]/g, '') === 'ログハウス・バディ' &&
              !actual.pathname.includes('/192011/') && hotelNo !== '192011') {
              throw new Error('Loghouse Buddy affiliate destination does not match the displayed hotel');
            }
          }
          JS
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - name: Build with public API endpoint
        env:
          REGIONAL_ADS_ENDPOINT: ${{ vars.REGIONAL_ADS_ENDPOINT }}
        run: flutter build web --release --no-pub --base-href /kunitori-nara/ --dart-define="REGIONAL_ADS_ENDPOINT=$REGIONAL_ADS_ENDPOINT"
      - name: Publish gh-pages
        run: |
          touch build/web/.nojekyll
          git fetch origin gh-pages:refs/remotes/origin/gh-pages
          git worktree add /tmp/kunitori-pages origin/gh-pages
          rsync -a --delete --exclude=.git build/web/ /tmp/kunitori-pages/
          cd /tmp/kunitori-pages
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publish Web from $GITHUB_SHA"
            git push origin HEAD:gh-pages
          fi
      - name: Request Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq '.status'
