name: Native Android and iOS
on:
  push:
    branches: [attackable-place-search]
    paths: ['lib/**', 'android/**', 'ios/**', 'pubspec.*', '.github/workflows/native.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: android
          - os: macos-15
            target: ios
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /lib/
            /test/
            /assets/
            /android/
            /ios/
            /data/prepared_maps/map-image-manifest.json
            /pubspec.yaml
            /pubspec.lock
            /analysis_options.yaml
            /.metadata
      - uses: actions/setup-java@v4
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Test portable saves
        run: flutter test --no-pub test/save_transfer_test.dart test/game_test.dart
      - name: Build Android APK
        if: matrix.target == 'android'
        run: flutter build apk --release --no-pub --target-platform android-arm,android-arm64,android-x64
      - name: Build unsigned iOS device app
        if: matrix.target == 'ios'
        run: |
          flutter build ios --release --no-pub --no-codesign
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app build/kunitori-ios-unsigned.app.zip
      - name: Build iOS simulator app
        if: matrix.target == 'ios'
        run: |
          flutter build ios --simulator --debug --no-pub
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app build/kunitori-ios-simulator.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: kunitori-${{ matrix.target }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/kunitori-ios-*.app.zip
