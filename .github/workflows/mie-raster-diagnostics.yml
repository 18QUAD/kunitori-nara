name: Diagnose Mie raster gaps
on:
  push:
    branches: [fix/owase-map-gaps]
    paths:
      - '.github/workflows/mie-raster-diagnostics.yml'
      - 'test/map_boundary_test.dart'
      - 'lib/**'
permissions:
  contents: read
concurrency:
  group: mie-raster-${{ github.ref }}
  cancel-in-progress: true
jobs:
  superseded:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {data} = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'mie-raster-diagnostics.yml',
              branch: 'fix/owase-map-gaps', per_page: 20,
            });
            for (const run of data.workflow_runs) {
              if (run.id !== context.runId && run.run_number < Number(context.runNumber) && ['queued', 'in_progress'].includes(run.status)) {
                await github.rest.actions.cancelWorkflowRun({...context.repo, run_id: run.id});
              }
            }
  raster:
    needs: superseded
    strategy:
      fail-fast: false
      matrix:
        renderer: [software, impeller]
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/
            /lib/
            /test/
            /assets/
            /data/prepared_maps/map-image-manifest.json
            /pubspec.yaml
            /pubspec.lock
            /analysis_options.yaml
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Render northern Mie and Owase with the selected backend
        env:
          RENDERER: ${{ matrix.renderer }}
        shell: bash
        run: |
          set -o pipefail
          if [ "$RENDERER" = impeller ]; then
            flutter test --no-pub --enable-impeller --timeout 60s --reporter expanded test/map_boundary_test.dart 2>&1 | tee raster.log
          else
            flutter test --no-pub --no-enable-impeller --timeout 60s --reporter expanded test/map_boundary_test.dart 2>&1 | tee raster.log
          fi
      - name: Test app regressions and TestFlight configuration
        if: matrix.renderer == 'software'
        run: |
          python3 test/testflight_pipeline_test.py
          flutter test --no-pub test/save_transfer_test.dart test/game_test.dart test/attack_button_test.dart test/native_display_test.dart test/action_choices_test.dart test/app_typography_test.dart test/tip_appearance_test.dart test/tip_character_test.dart
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mie-raster-${{ matrix.renderer }}
          path: raster.log
          if-no-files-found: ignore
          retention-days: 7
